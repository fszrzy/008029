<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>查看图片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #f7f7f7;
            overflow: hidden;
            -webkit-user-select: auto;
            user-select: auto;
        }

        .image-wrap {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        .image-wrap img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div class="image-wrap">
        <img id="viewImg" src="" alt="图片">
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const imgUrl = params.get("src") || "";
        if (imgUrl) {
            document.getElementById("viewImg").src = imgUrl;
        }
    </script>
</body>
</html>
