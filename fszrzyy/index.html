<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>佛山市不动产权信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            background-color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #333333;
        }

        body {
            padding: 16px 18px;
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #2978bb;
            margin-bottom: 22px;
            font-weight: bold;
        }

        .item-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            border-bottom: 1px solid #cccccc;
            padding-top: 8px;
            padding-bottom: 4px;
            padding-left: 2px;
            padding-right: 2px;
            align-items: start;
            font-size: 16px;
            line-height: 1.45;
        }

        .label-col {
            font-weight: bold;
            color: #444444;
        }

        .value-col {
            font-weight: normal;
            color: #333333;
        }

        .red-text {
            color: #dd0000;
            font-weight: bold;
        }

        .btn-wrap {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: nowrap;
        }

        .item-btn {
            text-align: center;
            min-width: 70px;
        }

        .item-btn img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .item-btn a {
            display: block;
            margin-top: 6px;
            font-size: 17px;
            color: #2986dd;
            text-decoration: none;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <h1>佛山市不动产权信息</h1>

    <div class="item-row">
        <div class="label-col">权利类型</div>
        <div class="value-col">房地产权</div>
    </div>

    <div class="item-row">
        <div class="label-col">坐落</div>
        <div class="value-col">广东省佛山市南海区里水镇洲村岗美村南十巷8号之一</div>
    </div>

    <div class="item-row">
        <div class="label-col">用途</div>
        <div class="value-col">住宅</div>
    </div>

    <div class="item-row">
        <div class="label-col">面积</div>
        <div class="value-col">18.00 m²</div>
    </div>

    <div class="item-row">
        <div class="label-col">查封状态</div>
        <div class="value-col">未查封</div>
    </div>

    <div class="item-row">
        <div class="label-col">抵押状态</div>
        <div class="value-col">未抵押</div>
    </div>

    <div class="item-row">
        <div class="label-col">预告状态</div>
        <div class="value-col">未预告</div>
    </div>

    <div class="item-row">
        <div class="label-col">异议状态</div>
        <div class="value-col">未异议</div>
    </div>

    <div class="item-row">
        <div class="label-col">冻结状态</div>
        <div class="value-col"><span class="red-text">已冻结</span></div>
    </div>

    <div class="item-row">
        <div class="label-col">权属状态</div>
        <div class="value-col">有效</div>
    </div>

    <div class="btn-wrap">
        <div class="item-btn">
            <a href="view_image.html?src=fcfht.jpg" target="_blank" rel="noopener noreferrer">
                <img src="分户图logo.jpg" alt="分户图">
                <span>分户图</span>
            </a>
        </div>

        <div class="item-btn">
            <a href="view_image.html?src=zdt.jpg" target="_blank" rel="noopener noreferrer">
                <img src="宗地图logo.jpg" alt="宗地图">
                <span>宗地图</span>
            </a>
        </div>

        <div class="item-btn">
            <a href="FC440605008029JC00203F00010001.pdf" target="_blank" rel="noopener noreferrer">
                <img src="分户图logo.jpg" alt="分户图pdf">
                <span>分户图pdf</span>
            </a>
        </div>

        <div class="item-btn">
            <a href="440605008029JC00203.pdf" target="_blank" rel="noopener noreferrer">
                <img src="宗地图logo.jpg" alt="宗地图pdf">
                <span>宗地图pdf</span>
            </a>
        </div>
    </div>

</body>
</html>
